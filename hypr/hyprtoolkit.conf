# Theme for hyprtoolkit-based apps (hyprlauncher, ...).
# Colors are 0xFFRRGGBB. Gruvbox Material (dark, orange accent).

background = 0xB31B1B1B        # dark background (translucent, blurred)
base = 0xCC282828              # background
text = 0xFFD4BE98              # foreground
alternate_base = 0xCC32302F    # lighter background
bright_text = 0xFFDDC7A1
link_text = 0xFF7DAEA3         # blue
accent = 0xFFE78A4E            # orange
accent_secondary = 0xFF89B482  # aqua

rounding_large = 16
rounding_small = 8

h1_size = 22
h2_size = 15
h3_size = 13
font_size = 14
small_font_size = 11

font_family = JetBrainsMono Nerd Font
font_family_monospace = JetBrainsMono Nerd Font
icon_theme = Papirus-Dark
