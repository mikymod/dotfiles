# ==============================================================================
# HYPRIDLE CONFIGURATION
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Hyprland 0.57 Lua dispatch: dpms needs a table. A bare string such as
    # hl.dsp.dpms("on") is ignored and falls back to "toggle".
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Dim screen after 2.5 minutes.
listener {
    timeout = 150
    on-timeout = sh -c 'if [ "$(cat /sys/class/power_supply/AC/online)" = "0" ]; then brightnessctl -s set 10%; fi'
    # on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Turn displays off after 5 minutes (on battery only).
listener {
    timeout = 300
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Lock screen after 5.5 minutes.
listener {
    timeout = 330
    on-timeout = pidof hyprlock || hyprlock
}

