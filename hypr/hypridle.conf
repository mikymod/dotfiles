# ==============================================================================
# HYPRIDLE CONFIGURATION
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim screen after 2.5 minutes.
listener {
    timeout = 150
    on-timeout = sh -c 'if [ "$(cat /sys/class/power_supply/AC/online)" = "0" ]; then brightnessctl -s set 10%; fi'
    # on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Turn displays off after 5 minutes.
listener {
    timeout = 300
    on-timeout = sh -c 'if [ "$(cat /sys/class/power_supply/AC/online)" = "0" ]; then hyprctl dispatch dpms off; fi'
    # on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock screen after 5.5 minutes.
listener {
    timeout = 330
    on-timeout = pidof hyprlock || hyprlock
}

