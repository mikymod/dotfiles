# hyprlauncher (Super+Space app menu, also the picker behind scripts/menu)
# Options: https://github.com/hyprwm/hyprlauncher (src/config/ConfigManager.cpp)
# Colors, fonts and rounding come from hyprtoolkit.conf.
# The daemon reads this once: restart it after edits (pkill hyprlauncher; hyprlauncher -d).

general {
    grab_focus = true
    show_apps_on_open = true # list most-used apps right away instead of an empty list
}

finders {
    desktop_icons = true
    desktop_terminal = ghostty -e # run Terminal=true apps (btop, nvim, ...) inside ghostty

    # Prefixes typed in the search box:  =  calculator     '  fonts
    # The unicode finder ("." by default) lists every codepoint from U+0000,
    # control characters included, so an empty query shows broken rows. It is
    # disabled (empty prefix never matches); use the curated pickers instead:
    # Super+. emoji, Super+Shift+. symbols (scripts/menu).
    unicode_prefix =
}

ui {
    window_size = 720, 460
}
